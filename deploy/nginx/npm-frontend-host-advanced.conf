# SmartRoute AI — per-host "Advanced" tab config for the frontend proxy host.
#
# INSTALL: NPM UI (:81) → Hosts → Proxy Hosts → (your app host) → Advanced →
# "Custom Nginx Configuration" → paste this file → Save.
#
# NOTE: deliberately zoneless (no limit_req/limit_conn) — see the API host
# file. Timeouts only; rate limiting lives in the FastAPI app.

client_body_timeout   15s;
client_header_timeout 15s;
send_timeout          30s;
keepalive_timeout     30s;
