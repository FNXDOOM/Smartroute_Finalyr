# SmartRoute AI — per-host "Advanced" tab config for the API proxy host.
#
# INSTALL: NPM UI (:81) → Hosts → Proxy Hosts → (your api host) → Advanced →
# "Custom Nginx Configuration" → paste this file → Save.
#
# NOTE: deliberately zoneless (no limit_req/limit_conn). Those directives need
# http-level zones which NPM's Advanced tab cannot define, and this deployment
# keeps rate limiting in the FastAPI app (backend/utils/rate_limit.py) instead.
# All directives below are server-level valid and self-contained.

client_body_timeout   15s;
client_header_timeout 15s;
send_timeout          30s;
keepalive_timeout     30s;

# Belt-and-braces body cap (mirrors the app's 1 MiB guard).
client_max_body_size 1m;

# Standard proxy hardening.
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_read_timeout 60s;
