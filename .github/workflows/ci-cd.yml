# SmartRouteAI CI/CD — GitHub → Docker Hub → EC2 (EC2 is GIT-FREE).
#
# PRs: lint + tests + frontend build (no push, no deploy).
# Push to main: lint + tests + build + docker build/push (:<short-sha> + :latest)
#   + EC2 deploy of the immutable :<short-sha> tag (never :latest).
#
# EC2 NEVER runs git and holds NO source repo. Each deploy SCPs ONLY:
#   docker-compose.prod.yml + deploy/deploy.sh  →  $EC2_DEPLOY_DIR/
# then runs deploy.sh <SHA>, which pulls images, fetches secrets from
# AWS Secrets Manager via the IAM instance role, migrates, and starts compose.
#
# Backend runtime secrets are NEVER in GitHub. EC2 fetches them from
# AWS Secrets Manager via its IAM instance role (see deploy/deploy.sh).
# Only public frontend build args (VITE_API_BASE_URL, VITE_CLERK_PUBLISHABLE_KEY)
# are in GitHub Variables/Secrets — they end up in the browser bundle by design.

name: CI/CD

on:
  pull_request:
  push:
    branches: [main]

# Prevent two production deploys overlapping and corrupting each other.
# PR checks also serialize behind this group (safe, slightly slower).
concurrency:
  group: production
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.10"
  NODE_VERSION: "20"

jobs:
  # ---------- PR + main: backend tests ----------
  backend-tests:
    name: backend tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Setup Python
        uses: actions/setup-python@v5.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run pytest
        env:
          # Dummy non-secret values for CI only. Real secrets live in
          # AWS Secrets Manager and are never in GitHub.
          DATABASE_URL: sqlite:///./ci_test.db
          LOCAL_JWT_SECRET: ci-only-dummy-not-a-secret
          APP_ENV: test
          AUTH_PROVIDER: clerk
          CLERK_JWKS_URL: https://ci.invalid/.well-known/jwks.json
          CLERK_ISSUER: https://ci.invalid
        run: pytest tests/ -v

  # ---------- PR + main: frontend lint + prod build check ----------
  frontend-ci:
    name: frontend lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Setup Node
        uses: actions/setup-node@v4.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build check (dummy public vars, no secrets)
        env:
          VITE_API_BASE_URL: http://localhost:8000
          VITE_CLERK_PUBLISHABLE_KEY: pk_test_ci_dummy
        run: npm run build

  # ---------- main only: build + push immutable images ----------
  docker-push:
    name: docker build + push
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-ci]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      short_sha: ${{ steps.sha.outputs.short_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Compute short SHA (immutable deploy tag)
        id: sha
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3.2.0

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3.7.1

      - name: Login to Docker Hub
        uses: docker/login-action@v3.3.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build + push backend (api/worker shared image)
        uses: docker/build-push-action@v6.13.0
        with:
          context: .
          file: ./backend/Dockerfile
          push: true
          # Immutable SHA tag + convenience latest. Deploy uses SHA only.
          tags: |
            ${{ vars.DOCKERHUB_NAMESPACE }}/smartroute-api:${{ steps.sha.outputs.short_sha }}
            ${{ vars.DOCKERHUB_NAMESPACE }}/smartroute-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build + push frontend (prod VITE_* baked in)
        uses: docker/build-push-action@v6.13.0
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ vars.DOCKERHUB_NAMESPACE }}/smartroute-frontend:${{ steps.sha.outputs.short_sha }}
            ${{ vars.DOCKERHUB_NAMESPACE }}/smartroute-frontend:latest
          # Only public values. Never backend secrets here.
          build-args: |
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL }}
            VITE_CLERK_PUBLISHABLE_KEY=${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test backend image (fail fast if runtime deps missing)
        # Imports the app inside the JUST-PUSHED immutable image. A missing
        # production dependency (e.g. httpx in requirements.txt) fails here,
        # BEFORE the image reaches EC2. config.py raises at import without
        # LOCAL_JWT_SECRET, so dummy CI-only values are passed explicitly.
        run: |
          docker run --rm \
            -e DATABASE_URL=sqlite:///./ci_test.db \
            -e LOCAL_JWT_SECRET=ci-only-dummy-not-a-secret \
            -e APP_ENV=test \
            -e AUTH_PROVIDER=clerk \
            -e CLERK_JWKS_URL=https://ci.invalid/.well-known/jwks.json \
            -e CLERK_ISSUER=https://ci.invalid \
            "${{ vars.DOCKERHUB_NAMESPACE }}/smartroute-api:${{ steps.sha.outputs.short_sha }}" \
            python -c "import main; print('backend image import ok')"

  # ---------- main only: ship bundle to EC2 (GIT-FREE) + deploy exact SHA ----------
  deploy-prod:
    name: deploy to EC2
    runs-on: ubuntu-latest
    needs: [docker-push]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Checkout deployment bundle source
        uses: actions/checkout@v4.2.2

      - name: Transfer bundle + deploy over SSH (no git on EC2)
        env:
          IMAGE_TAG: ${{ needs.docker-push.outputs.short_sha }}
          DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
          BACKEND_SECRET_ID: ${{ vars.BACKEND_SECRET_ID }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_DEPLOY_DIR: ${{ vars.EC2_DEPLOY_DIR }}
        run: |
          set -euo pipefail

          : "${IMAGE_TAG:?docker-push short_sha missing}"
          : "${DOCKERHUB_NAMESPACE:?vars.DOCKERHUB_NAMESPACE missing}"
          : "${EC2_HOST:?secrets.EC2_HOST missing}"
          : "${EC2_USER:?secrets.EC2_USER missing}"
          : "${EC2_SSH_KEY:?secrets.EC2_SSH_KEY missing}"

          # Absolute path only. The old default "~/Smartroute" is banned on
          # purpose: "~" does NOT expand inside quoted SCP/SSH targets, so a
          # vars value of ~/... silently creates a literal directory named "~".
          DEPLOY_DIR="${EC2_DEPLOY_DIR:-/opt/smartroute}"
          case "${DEPLOY_DIR}" in
            "~"*) echo "ERROR: EC2_DEPLOY_DIR must be absolute (e.g. /opt/smartroute), got '${DEPLOY_DIR}'." >&2; exit 2;;
            "/"*) ;;
            *)    echo "ERROR: EC2_DEPLOY_DIR must be absolute, got '${DEPLOY_DIR}'." >&2; exit 2;;
          esac
          if [ "${IMAGE_TAG}" = "latest" ]; then
            echo "ERROR: refusing to deploy ':latest'. Use an immutable git SHA tag." >&2
            exit 2
          fi

          # These are the ONLY two files EC2 is allowed to need.
          test -f docker-compose.prod.yml || { echo "ERROR: docker-compose.prod.yml missing in repo root." >&2; exit 2; }
          test -f deploy/deploy.sh || { echo "ERROR: deploy/deploy.sh missing." >&2; exit 2; }

          # --- SSH setup with host-key checking ON ---
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${EC2_SSH_KEY}" > ~/.ssh/ec2_deploy_key
          chmod 600 ~/.ssh/ec2_deploy_key
          ssh-keyscan -H "${EC2_HOST}" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          SSH="ssh -i ~/.ssh/ec2_deploy_key -o StrictHostKeyChecking=yes -o ConnectTimeout=15 -p 22"
          SCP="scp -i ~/.ssh/ec2_deploy_key -o StrictHostKeyChecking=yes -o ConnectTimeout=15 -P 22"

          echo "Deploy dir on EC2: ${DEPLOY_DIR}"
          # shellcheck disable=SC2029
          ${SSH} "${EC2_USER}@${EC2_HOST}" "mkdir -p '${DEPLOY_DIR}/deploy'"

          echo "Uploading deployment bundle (2 files only, no repo)..."
          ${SCP} docker-compose.prod.yml "${EC2_USER}@${EC2_HOST}:${DEPLOY_DIR}/docker-compose.prod.yml"
          ${SCP} deploy/deploy.sh "${EC2_USER}@${EC2_HOST}:${DEPLOY_DIR}/deploy/deploy.sh"

          echo "Running deploy.sh for IMAGE_TAG=${IMAGE_TAG}..."
          # Values passed here are non-secret (namespace, SHA, secret ID, region).
          # Backend secrets are fetched ON EC2 from Secrets Manager, never via SSH.
          # shellcheck disable=SC2029
          ${SSH} "${EC2_USER}@${EC2_HOST}" "chmod +x '${DEPLOY_DIR}/deploy/deploy.sh' && DOCKERHUB_NAMESPACE='${DOCKERHUB_NAMESPACE}' IMAGE_TAG='${IMAGE_TAG}' BACKEND_SECRET_ID='${BACKEND_SECRET_ID}' AWS_REGION='${AWS_REGION}' '${DEPLOY_DIR}/deploy/deploy.sh' '${IMAGE_TAG}'"

          shred -u ~/.ssh/ec2_deploy_key 2>/dev/null || rm -f ~/.ssh/ec2_deploy_key
