apiVersion: 1

# Loads the JSON dashboards mounted at /etc/grafana/dashboards. Kept separate
# from that directory on purpose: Grafana reads every file in a provider path
# as a dashboard.
providers:
  - name: smartroute
    folder: SmartRoute
    type: file
    disableDeletion: true
    updateIntervalSeconds: 30
    allowUiUpdates: false
    options:
      path: /etc/grafana/dashboards
