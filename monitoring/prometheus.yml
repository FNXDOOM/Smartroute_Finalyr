# Prometheus scrape config shared by development and production.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Prometheus self-monitoring.
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  # API metrics; worker health is included through job_runs.
  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
