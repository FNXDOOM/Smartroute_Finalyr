# Monitoring stack: Prometheus + Grafana as standalone containers, attached to
# the app's docker network (smartroute-net, named in docker-compose.yml and
# docker-compose.prod.yml) so Prometheus can scrape api:8000 and Grafana can
# reach prometheus:9090.
#
# The app stack must be up first because it owns the network:
#   docker compose up -d
#   docker compose -f docker-compose.monitoring.yml up -d
#
# Then open:  Prometheus http://localhost:9090  Grafana http://localhost:3000
#
# Ports are bound to 127.0.0.1 only: Prometheus has no authentication and
# Grafana is not wired into the app's Clerk login, so nothing is reachable
# from outside the machine. On EC2, look at them through an SSH tunnel:
#   ssh -L 9090:127.0.0.1:9090 -L 3000:127.0.0.1:3000 <ec2-host>

services:
  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: smartroute-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    restart: unless-stopped
    networks: [smartroute]

  grafana:
    image: grafana/grafana:11.4.0
    container_name: smartroute-grafana
    environment:
      # A default, not `${VAR:?}`: a required variable here would fail `up`
      # on any machine that has not exported GRAFANA_ADMIN_PASSWORD.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped
    networks: [smartroute]

networks:
  smartroute:
    external: true
    name: smartroute-net

volumes:
  prometheus_data:
  grafana_data:
